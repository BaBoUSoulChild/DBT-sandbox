version: 2

models:

  - name: gld_commandes_par_jour
    description: "KPI journaliers des commandes, partitionnés par mois"
    columns:
      - name: date_commande
        tests:
          - not_null
          - unique
          # Chaque jour agrégé en Gold doit avoir des données dans Silver
          - couverture_agregat:
              source_model: ref('slv_commandes')
              date_column_source: updated_at
      - name: ca_ht_total
        tests:
          - not_null
      - name: nb_commandes
        tests:
          - not_null

  - name: gld_kpi_clients
    description: "KPI clients mensuels avec CA, panier moyen et taux d'annulation"
    columns:
      - name: id_client
        tests:
          - not_null
          # Chaque client en Gold doit exister dans Silver
          - cles_orphelines:
              source_model: ref('slv_clients')
      - name: date_reference
        tests:
          - not_null
          - couverture_agregat:
              source_model: ref('slv_commandes')
              date_column_source: updated_at
