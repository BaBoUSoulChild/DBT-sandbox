version: 2

models:

  - name: slv_commandes
    description: "{{ doc('slv_commandes') }}"
    meta:
      owner: equipe-data-engineering
      domaine: commandes
      couche: silver
      sla: "chargement quotidien J (après Bronze)"
      sensibilite: confidentiel
    tests:
      - taux_rejet_max:
          source_model: ref('brz_commandes')
          key_column: id_commande
          seuil_pct: 5
    columns:
      - name: id_commande
        description: >
          Identifiant de la commande. Unique au sein de chaque partition updated_at
          (dédup intra-partition). NON unique au niveau de la table globale : une
          commande modifiée apparaît dans plusieurs partitions. Déduplication
          inter-partitions déléguée aux modèles Gold.
        tests:
          - not_null
          - cles_orphelines:
              source_model: ref('brz_commandes')
      - name: id_client
        description: "Clé étrangère vers `slv_clients`. Non nulle à cette couche (lignes orphelines rejetées)."
        tests:
          - not_null
      - name: date_commande
        description: "Date métier de la commande, stable et immuable. Issue de la source via Bronze."
      - name: montant_ht
        description: "{{ doc('slv_col_montant_ht') }}"
        tests:
          - not_null
      - name: statut_code
        description: "{{ doc('slv_col_statut_code') }}"
        tests:
          - not_null
      - name: statut_libelle
        description: "{{ doc('slv_col_statut_libelle') }}"
      - name: updated_at
        description: "Timestamp de dernière modification source. Clé de partition Silver."
        tests:
          - not_null
      - name: _loaded_at
        description: "{{ doc('brz_col_loaded_at') }}"
      - name: _dbt_invocation_id
        description: "Identifiant du run dbt ayant produit la ligne."
      - name: annee
        description: "{{ doc('brz_col_partition_annee') }}"
      - name: mois
        description: "{{ doc('brz_col_partition_mois') }}"
      - name: jour
        description: "{{ doc('brz_col_partition_jour') }}"

  - name: slv_clients
    description: "{{ doc('slv_clients') }}"
    meta:
      owner: equipe-data-engineering
      domaine: clients
      couche: silver
      sla: "chargement quotidien J (après Bronze)"
      sensibilite: confidentiel
    tests:
      - taux_rejet_max:
          source_model: ref('brz_clients')
          key_column: id_client
          seuil_pct: 2
    columns:
      - name: id_client
        description: >
          Identifiant du client. Unique au sein de chaque partition updated_at.
          Potentiellement multi-versions au niveau de la table globale si un client
          est modifié. Déduplication inter-partitions déléguée aux modèles Gold.
        tests:
          - not_null
          - cles_orphelines:
              source_model: ref('brz_clients')
      - name: nom
        description: "Nom du client normalisé en majuscules sans espaces superflus."
      - name: email
        description: "Adresse email en minuscules. Usage interne uniquement."
      - name: email_masque
        description: "{{ doc('slv_col_email_masque') }}"
        tests:
          - not_null
      - name: pays
        description: "Code pays normalisé en majuscules."
      - name: updated_at
        description: "Timestamp de dernière modification source."
        tests:
          - not_null
      - name: _loaded_at
        description: "{{ doc('brz_col_loaded_at') }}"
      - name: _dbt_invocation_id
        description: "Identifiant du run dbt ayant produit la ligne."
      - name: annee
        description: "{{ doc('brz_col_partition_annee') }}"
      - name: mois
        description: "{{ doc('brz_col_partition_mois') }}"
      - name: jour
        description: "{{ doc('brz_col_partition_jour') }}"
