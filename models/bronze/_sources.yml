version: 2

sources:
  - name: raw
    description: "Tables brutes issues du système source (landing zone Hive)"
    database: "{{ target.schema }}_raw"
    schema: "{{ target.schema }}_raw"
    tables:

      - name: commandes
        description: "Flux de commandes brut extrait du système transactionnel"
        columns:
          - name: id_commande
            description: "Identifiant unique de la commande"
          - name: id_client
            description: "Clé étrangère vers le client"
          - name: montant_ht
            description: "Montant hors taxe en euros"
          - name: statut
            description: "Code statut de la commande"
          - name: date_commande
            description: "Date de passage de la commande (date métier stable, immuable). Clé de partitionnement Silver."
          - name: updated_at
            description: "Timestamp de dernière modification (clé de partitionnement Bronze)."

      - name: clients
        description: "Référentiel clients brut"
        columns:
          - name: id_client
            description: "Identifiant unique du client"
          - name: nom
          - name: email
          - name: pays
          - name: updated_at
            description: "Timestamp de dernière modification"
